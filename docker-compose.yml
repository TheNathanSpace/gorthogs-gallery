services:
  reliquary:
    build: .
    image: reliquary:local
    ports:
      - "3847:3847"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SITE_TITLE: ${SITE_TITLE:-The Reliquary}
      SITE_TAGLINE: ${SITE_TAGLINE:-A vault of painted miniatures}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      LOCALE: ${LOCALE:-en}
      DATA_DIR: /data
      SEED_DEMO: ${SEED_DEMO:-true}
      # The image runs NODE_ENV=production and refuses to boot if AUTH_SECRET
      # is a placeholder. Set it before compose up. First login uses vault key
      # "changeme", then the keeper chooses a lasting key stored in /data —
      # not here. If PUBLIC_BASE_URL is https://…, AUTH_COOKIE_SECURE must
      # be true.
      # Behind HTTPS, set AUTH_COOKIE_SECURE=true and PUBLIC_BASE_URL.
      # If Server Actions fail through the proxy, set SERVER_ACTION_ORIGINS
      # at image build time (see README). The proxy should still forward
      # X-Forwarded-Host and X-Forwarded-Proto.
    volumes:
      # Entire vault (SQLite + photographs). Copy this volume to clone the gallery.
      - reliquary-data:/data
    # Writable paths with a read-only root: the /data volume and tmpfs /tmp.
    # Sharp and Next.js use /tmp for short-lived files. Do not mount /tmp on disk.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    # Memory: treat this limit carefully. Too low and Docker SIGKILLs the
    # process mid-upload (OOM, exit 137). Pixel count drives RAM, not file
    # size. A 3000×4000 photo is ~46 MiB uncompressed RGBA; Sharp decode
    # peaked ~26–73 MiB above idle. Next.js idle is typically 150–300 MiB.
    # 1G is the comfortable default. Do not go below 512M for 12MP photos.
    # Full table: docs/memory.md
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3847/api/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  reliquary-data:
