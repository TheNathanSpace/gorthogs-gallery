name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require v-prefixed semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # semver.org, with a required v prefix (v1.2.3, v1.2.3-rc.1)
          if ! echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'; then
            echo "Tag '$TAG' is not semver with a v prefix. Use v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

  check:
    needs: validate
    uses: ./.github/workflows/ci.yml

  docker:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=The Reliquary
            org.opencontainers.image.description=A vault of painted miniatures

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  release:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Write release body
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.docker.outputs.digest }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)"

          {
            cat <<EOF
          ## Container image

          \`\`\`bash
          docker pull ${IMAGE}:${TAG}
          \`\`\`

          Also tagged as the semver without the \`v\` prefix (and \`:latest\`, except on pre-releases).

          Digest: \`${DIGEST}\`

          Copy \`docker-compose.yaml\` onto the server. Set \`image:\` to \`${IMAGE}:${TAG}\`, and set \`AUTH_SECRET\` and \`PUBLIC_BASE_URL\` in that file, then \`docker compose up -d\`.

          If this is the first image from a public repository, GitHub may keep the GHCR package private until you set it public: **Packages → the package → Package settings → Change visibility**.

          ## Changelog

          EOF
            if [ -n "${PREV}" ]; then
              echo "Changes since ${PREV}:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV}..HEAD"
              echo
              echo
              echo "[Full changelog](${SERVER}/${REPO}/compare/${PREV}...${TAG})"
            else
              echo "First tagged release."
              echo
              git log --no-merges --pretty=format:'- %s (%h)' HEAD
              echo
            fi
            echo
          } > release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
