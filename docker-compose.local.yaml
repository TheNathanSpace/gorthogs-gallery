# Local image build from this repo. Not the server deploy file.
# docker compose -f docker-compose.local.yaml up --build
#
# The image is still NODE_ENV=production, so AUTH_SECRET must be a
# real value (openssl rand -base64 48), not the placeholder.

services:
  reliquary:
    build: .
    image: reliquary:local
    ports:
      - "3847:3847"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env — openssl rand -base64 48}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SITE_TITLE: ${SITE_TITLE:-The Reliquary}
      SITE_TAGLINE: ${SITE_TAGLINE:-A vault of painted miniatures}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      LOCALE: ${LOCALE:-en}
      DATA_DIR: /data
      SEED_DEMO: ${SEED_DEMO:-true}
      PWNED_PASSWORDS: ${PWNED_PASSWORDS:-true}
    volumes:
      - reliquary-data:/data
    # Root filesystem is read-only. The only writable places are the
    # /data volume (vault) and this tmpfs /tmp. Sharp writes upload
    # scratch here; Next.js writes short-lived files. Do not drop the
    # tmpfs and do not bind-mount /tmp to disk. 256m is RAM (counts
    # toward mem_limit); 1777 is a normal sticky /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3847/api/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  reliquary-data:
